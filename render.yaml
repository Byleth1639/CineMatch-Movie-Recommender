services:
  - type: web
    name: cinematch-movie-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/prepare_catalog.py --download
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
